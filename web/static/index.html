<!DOCTYPE html><html><head><link rel="stylesheet" type="text/css" href="/assets/lib/bootstrap/main/dist/css/bootstrap.min.css"><link rel="stylesheet" type="text/css" href="/assets/lib/@loadingio/bootstrap.ext/main/index.min.css"><link rel="stylesheet" type="text/css" href="/css/index.css"></head><body><div class="w-100 p-4"><h4 class="mb-3">pdmap-world &mdash; choropleth &amp; dorling cartogram</h4><div class="small text-muted mb-2">every control below drives both maps, so the same settings can be compared on a whole-world layout and on a six-country one.</div><div class="d-flex flex-wrap align-items-center mb-2" id="controls"><div class="mr-3 mb-2"><button class="btn btn-sm btn-primary" id="mode-toggle">switch to dorling</button></div><div class="mr-3 mb-2"><button class="btn btn-sm btn-outline-secondary" id="reroll">re-roll data</button></div><div class="mr-3 mb-2"><label class="mb-0"><input type="checkbox" checked id="opt-basemap"> basemap</label></div><div class="mr-3 mb-2"><label class="mb-0"><input type="checkbox" id="opt-link"> link</label></div><div class="mr-3 mb-2"><label class="mb-0"> gravity&nbsp;<select class="custom-select custom-select-sm d-inline-block w-auto" id="opt-gravity"><option value="centroid" selected>centroid</option><option value="center">center</option></select></label></div><div class="mr-3 mb-2"><label class="mb-0"> strength&nbsp;<input type="range" min="0.01" max="1" step="0.01" value="0.15" id="opt-strength"><span class="small text-muted" id="opt-strength-value">0.15</span></label></div><div class="mr-3 mb-2"><label class="mb-0"> collide&nbsp;<input type="range" min="0" max="8" step="0.5" value="1.5" id="opt-collide"><span class="small text-muted" id="opt-collide-value">1.5</span></label></div><div class="mr-3 mb-2"><label class="mb-0"><input type="checkbox" checked id="opt-auto"> auto radius</label></div><div class="mr-3 mb-2"><label class="mb-0"> fill&nbsp;<input type="range" min="0.05" max="1" step="0.05" value="0.4" id="opt-fill"><span class="small text-muted" id="opt-fill-value">0.40</span></label></div><div class="mr-3 mb-2"><label class="mb-0"> max r&nbsp;<input type="range" min="0" max="40" step="1" value="0" id="opt-radius"><span class="small text-muted" id="opt-radius-value">none</span></label></div><div class="mr-3 mb-2"><label class="mb-0"><input type="checkbox" checked id="opt-bounds"> bounds</label></div><div class="mr-3 mb-2"><label class="mb-0"><input type="checkbox" checked id="opt-tooltip"> tooltip</label></div></div><div class="d-flex w-100" id="maps"><div class="mx-2"><div class="small text-muted mb-1">world &mdash; every country</div><div class="aspect-ratio ratio-3by2"><svg class="w-100 h-100 border shadow" id="root-left"></svg></div></div><div class="mx-2"><div class="small text-muted mb-1">east asia &mdash; the same map narrowed with `includes`</div><div class="aspect-ratio ratio-3by2"><svg class="w-100 h-100 border shadow" id="root-right"></svg></div></div></div><div class="mt-4"><h6>tests</h6><ul class="list-unstyled small mb-0" id="tests"><li class="text-muted">running ...</li></ul></div></div><script src="https://d3js.org/d3.v4.js"></script><script src="https://d3js.org/topojson.v2.min.js"></script><script src="https://d3js.org/d3-color.v1.min.js"></script><script src="https://d3js.org/d3-interpolate.v1.min.js"></script><script src="https://d3js.org/d3-scale-chromatic.v1.min.js"></script><script type="text/javascript" src="/assets/lib/proxise/main/index.min.js" defer></script><script type="text/javascript" src="/assets/lib/@loadingio/ldquery/main/index.min.js" defer></script><script type="text/javascript" src="/assets/lib/@loadingio/debounce.js/main/index.min.js" defer></script><script type="text/javascript" src="/assets/lib/pdmap-world/dev/index.min.js" defer></script><script type="text/javascript" src="js/index.js" defer></script></body></html>
